<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Journal</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Journal">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="themeColor" content="#0D0F12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --sheet-ease:cubic-bezier(.32,.72,0,1);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --r-card:22px;
}
/* palette sobre : graphite, ardoise, vert et rouge éteints */
html[data-theme="light"]{
  --bg:#ECEDEF;--card:#FAFAFB;--card2:#F3F4F6;
  --text:#15181C;--text2:rgba(21,24,28,.66);--text3:rgba(21,24,28,.46);
  --fill:rgba(21,24,28,.055);--fill2:rgba(21,24,28,.10);--sep:rgba(21,24,28,.09);
  --ink:#1E2329;--on-ink:#F4F5F7;
  --hero:linear-gradient(155deg,#2C323A 0%,#1F242A 55%,#16191E 100%);--hero-fg:#F1F2F4;--hero-2:rgba(241,242,244,.62);--hero-fill:rgba(241,242,244,.09);--hero-shadow:0 1px 2px rgba(15,18,22,.08),0 14px 34px rgba(15,18,22,.22);
  --glass:rgba(250,250,251,.74);--glass-line:rgba(21,24,28,.09);--glass-shadow:0 10px 34px rgba(15,18,22,.14),0 1px 3px rgba(15,18,22,.06);
  --bubble:rgba(21,24,28,.07);--bubble-line:rgba(21,24,28,.09);--bubble-hi:rgba(255,255,255,.9);
  --card-shadow:0 1px 2px rgba(15,18,22,.05),0 0 0 .5px rgba(21,24,28,.06);
  --scrim:rgba(10,12,15,.34);--bar:rgba(236,237,239,.84);
  --accent:#4E6378;--pos:#2E7553;--neg:#A9473F;--pos-bg:rgba(46,117,83,.10);--neg-bg:rgba(169,71,63,.10);
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0D0F12;--card:#16191D;--card2:#1C2025;
  --text:#E9EBEE;--text2:rgba(233,235,238,.66);--text3:rgba(233,235,238,.44);
  --fill:rgba(233,235,238,.06);--fill2:rgba(233,235,238,.11);--sep:rgba(233,235,238,.08);
  --ink:#E9EBEE;--on-ink:#121417;
  --hero:linear-gradient(155deg,#272C33 0%,#1C2026 55%,#14171B 100%);--hero-fg:#F1F2F4;--hero-2:rgba(241,242,244,.58);--hero-fill:rgba(241,242,244,.08);--hero-shadow:0 14px 40px rgba(0,0,0,.5),inset 0 0 0 .5px rgba(241,242,244,.07);
  --glass:rgba(22,25,29,.68);--glass-line:rgba(233,235,238,.09);--glass-shadow:0 10px 34px rgba(0,0,0,.55);
  --bubble:rgba(233,235,238,.10);--bubble-line:rgba(233,235,238,.13);--bubble-hi:rgba(233,235,238,.16);
  --card-shadow:0 0 0 .5px rgba(233,235,238,.06);
  --scrim:rgba(0,0,0,.58);--bar:rgba(13,15,18,.80);
  --accent:#9AAABD;--pos:#7DB89A;--neg:#DB8A82;--pos-bg:rgba(125,184,154,.12);--neg-bg:rgba(219,138,130,.12);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
img,svg{-webkit-user-drag:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--text3)}
.num{font-variant-numeric:tabular-nums}

/* ---------- écran d'ouverture ---------- */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .6s ease,visibility .6s}
#splash.gone{opacity:0;visibility:hidden}
#splash .mk{display:flex;flex-direction:column;align-items:center;gap:22px}
#splash svg{width:236px;height:128px;overflow:visible}
#splash line{stroke-width:1.6;stroke-linecap:round}
#splash .cu rect{fill:var(--pos)}#splash .cu line{stroke:var(--pos)}
#splash .cd rect{fill:var(--neg)}#splash .cd line{stroke:var(--neg)}
#splash b{font-size:24px;font-weight:750;letter-spacing:-.3px;opacity:0;transform:translateY(6px);transition:opacity .45s ease,transform .45s var(--ease)}
#splash.txt b{opacity:1;transform:none}

/* ---------- pages ---------- */
#app{position:fixed;inset:0;will-change:transform}
#pages{position:absolute;inset:0;touch-action:pan-y}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;visibility:hidden;background:var(--bg);touch-action:pan-y}
.page.active{visibility:visible}
.topbar{position:sticky;top:0;z-index:5;height:calc(var(--safe-t) + 50px);padding:var(--safe-t) 12px 0;display:flex;align-items:center;gap:8px;transition:background-color .3s,box-shadow .3s}
.scrolled>.topbar,.push.scrolled .topbar{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 .5px 0 var(--sep)}
.topbar .tt{flex:1;text-align:center;font-size:16px;font-weight:600;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scrolled>.topbar .tt,.push.scrolled .topbar .tt{opacity:1;transform:none}
.topbar .sp{width:38px;flex:none}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--fill);flex:none;transition:transform .2s var(--ease),background-color .2s}
.ib:active{transform:scale(.9);background:var(--fill2)}
.ib svg{width:20px;height:20px}
.wrap{padding:0 16px calc(var(--safe-b) + 120px);max-width:620px;margin:0 auto}
h1.lt{font-size:33px;font-weight:800;letter-spacing:-.03em;margin:2px 4px 14px}
.sec{font-size:13px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:26px 6px 9px;display:flex;justify-content:space-between;align-items:baseline}
.sec a{text-transform:none;letter-spacing:0;font-size:14px;color:var(--accent);font-weight:600}

/* ---------- carte principale ---------- */
.hero{background:var(--hero);color:var(--hero-fg);border-radius:28px;padding:20px 20px 16px;position:relative;overflow:hidden;box-shadow:var(--hero-shadow)}
.hero .lbl{font-size:14px;font-weight:500;color:var(--hero-2);display:flex;justify-content:space-between;align-items:center}
.hero .big{font-size:42px;font-weight:700;letter-spacing:-.035em;margin:6px 0 2px;line-height:1.05}
.hero .big .cts{font-size:26px;opacity:.55}
.hero .delta{font-size:14px;color:var(--hero-2)}
.hero .delta b{color:var(--hero-fg);font-weight:600}
.hero .spark{height:64px;margin:12px -4px 4px}
.hero .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.hero .kp div{background:var(--hero-fill);border-radius:14px;padding:9px 11px}
.hero .kp small{display:block;font-size:11.5px;color:var(--hero-2);font-weight:500}
.hero .kp b{font-size:17px;font-weight:650;letter-spacing:-.02em}
.hero .mnav{display:flex;gap:4px}
.hero .mnav button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--hero-fill)}
.hero .mnav svg{width:15px;height:15px}
.curve{color:var(--accent)}.hero .curve{color:var(--hero-fg)}
.hero .curve .ln{stroke:var(--hero-fg);opacity:.9}.hero .curve .zero{stroke:var(--hero-fill)}
.hp{color:#9FD2B6}.hn{color:#F0A49C}

/* ---------- cartes & lignes ---------- */
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--card-shadow);overflow:hidden}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;width:100%;text-align:left;transition:background-color .15s}
button.row:active,.row.tap:active{background:var(--fill)}
.row+.row::before{content:"";position:absolute;top:0;left:64px;right:0;height:.5px;background:var(--sep)}
.row.plain+.row.plain::before{left:16px}
.row .ti{flex:1;min-width:0}
.row .ti b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ti small{display:block;font-size:13px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rv{text-align:right;flex:none}
.row .rv b{display:block;font-size:16px;font-weight:650;letter-spacing:-.01em}
.row .rv small{display:block;font-size:12.5px;color:var(--text3);margin-top:2px}
.row .chev{width:16px;height:16px;color:var(--text3);flex:none}
.dir{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--fill)}
.dir svg{width:19px;height:19px}
.dir.buy{color:var(--pos);background:var(--pos-bg)}.dir.sell{color:var(--neg);background:var(--neg-bg)}
.dir.open{color:var(--accent)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;background:var(--fill2);color:var(--text2);vertical-align:2px;margin-left:6px;letter-spacing:.02em}
.dayh{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--text3);margin:22px 6px 8px}
.empty{text-align:center;padding:34px 22px;color:var(--text3);font-size:15px;line-height:1.45}
.empty svg{width:42px;height:42px;opacity:.5;margin-bottom:8px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}

/* ---------- boutons, puces, champs ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:16px;background:var(--ink);color:var(--on-ink);font-size:16.5px;font-weight:650;transition:transform .2s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--fill2);color:var(--text)}
.btn.danger{background:var(--neg-bg);color:var(--neg)}
.btn svg{width:19px;height:19px}
.btns{display:flex;gap:10px;margin-top:14px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chips.wr{flex-wrap:wrap;overflow:visible}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--fill);font-size:14.5px;font-weight:600;color:var(--text2);transition:background-color .2s,color .2s,transform .2s var(--ease)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:var(--on-ink)}
.chip.add{color:var(--accent)}
.seg{display:flex;background:var(--fill);border-radius:13px;padding:3px;position:relative}
.seg button{flex:1;height:36px;border-radius:10px;font-size:15px;font-weight:600;color:var(--text2);position:relative;z-index:1;transition:color .25s}
.seg button.on{color:var(--text);background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px var(--sep)}
.seg.dir2 button.on[data-v="buy"]{color:var(--pos)}.seg.dir2 button.on[data-v="sell"]{color:var(--neg)}
.fl{display:block;font-size:13px;font-weight:600;color:var(--text3);margin:18px 6px 7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{background:var(--card);border-radius:16px;box-shadow:var(--card-shadow);padding:9px 14px 10px;display:block}
.fld small{display:block;font-size:12px;font-weight:600;color:var(--text3)}
.fld input,.fld textarea,.fld select{display:block;width:100%;border:0;outline:0;background:none;font:inherit;color:var(--text);font-size:17px;font-weight:550;padding:3px 0 0;-webkit-appearance:none;appearance:none}
.fld input::placeholder,.fld textarea::placeholder{color:var(--text3);font-weight:450}
.fld textarea{resize:none;min-height:80px;line-height:1.4;font-size:16px;font-weight:450}
.fld.wide{grid-column:1/-1}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.calc div{background:var(--fill);border-radius:14px;padding:9px 12px}
.calc small{display:block;font-size:11.5px;color:var(--text3);font-weight:600}
.calc b{font-size:16px;font-weight:650}
.swr{display:flex;align-items:center;gap:12px;padding:14px 16px}
.swr span{flex:1;font-size:16px;font-weight:500}
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;transition:background-color .3s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .35s var(--ease)}
.switch.on{background:var(--pos)}.switch.on::after{transform:translateX(20px)}
.est{float:right;font-size:12px;font-weight:700;color:var(--accent)}

/* ---------- statistiques ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:18px;box-shadow:var(--card-shadow);padding:13px 14px}
.tile small{display:block;font-size:12.5px;color:var(--text3);font-weight:600}
.tile b{display:block;font-size:22px;font-weight:700;letter-spacing:-.025em;margin-top:3px}
.tile b.sm{font-size:18px;white-space:nowrap}
.tile em{display:block;font-style:normal;font-size:12px;color:var(--text3);margin-top:1px}
.ringw{display:flex;align-items:center;gap:18px}
.ring{width:96px;height:96px;flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--fill2)}.ring .fgc{stroke:var(--pos);stroke-linecap:round;transition:stroke-dasharray .8s var(--ease)}
.ring text{fill:var(--text);font-size:20px;font-weight:700;font-family:var(--font)}
.ringw ul{list-style:none;margin:0;padding:0;flex:1;font-size:14.5px}
.ringw li{display:flex;justify-content:space-between;padding:4px 0;color:var(--text2)}
.ringw li b{color:var(--text);font-weight:650}
.bars .br{display:grid;grid-template-columns:88px 1fr auto;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.bars .br span{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .tr{height:9px;border-radius:5px;background:var(--fill);overflow:hidden}
.bars .tr i{display:block;height:100%;border-radius:5px;background:var(--pos)}
.bars .tr i.n{background:var(--neg)}
.bars .br b{font-weight:650;min-width:74px;text-align:right}
.curve{height:150px;display:block;width:100%}
.curve .ln{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.curve .zero{stroke:var(--sep);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}

/* ---------- calendrier ---------- */
.calh{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
.calh b{font-size:19px;font-weight:700;text-transform:capitalize}
.calh small{display:block;font-size:13.5px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dn{font-size:11.5px;font-weight:600;color:var(--text3);text-align:center;padding-bottom:4px}
.cal .c{aspect-ratio:1/1.12;border-radius:12px;background:var(--card);box-shadow:var(--card-shadow);padding:5px 4px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
.cal .c.o{background:none;box-shadow:none}
.cal .c.td{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal .c.p{background:var(--pos-bg)}.cal .c.n{background:var(--neg-bg)}
.cal .c i{font-style:normal;font-size:10.5px;font-weight:700;white-space:nowrap}
.cal .c.we{opacity:.55}

/* ---------- barre du bas & bulle (comme Zerly) ---------- */
#tabbar{position:fixed;z-index:20;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(max(var(--safe-b),14px) + 4px);display:flex;padding:5px;border-radius:34px;background:var(--glass);-webkit-backdrop-filter:saturate(190%) blur(26px);backdrop-filter:saturate(190%) blur(26px);box-shadow:var(--glass-shadow),inset 0 0 0 .5px var(--glass-line);touch-action:none;transition:transform .45s var(--ease),opacity .3s}
#tabbar.away{transform:translateY(140%);opacity:0;pointer-events:none}
#tabbar .tab{width:66px;height:54px;display:grid;place-items:center;position:relative;z-index:1;color:var(--text)}
#tabbar .tab svg{width:24px;height:24px;will-change:transform,opacity}
#bubble{position:absolute;top:5px;left:0;width:66px;height:54px;border-radius:27px;background:var(--bubble);box-shadow:inset 0 0 0 .5px var(--bubble-line),inset 0 1px 0 var(--bubble-hi),0 4px 14px rgba(0,0,0,.08);pointer-events:none}

/* ---------- écrans empilés ---------- */
#pushes{position:fixed;inset:0;z-index:30;pointer-events:none}
.push{position:absolute;inset:0;background:var(--bg);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;pointer-events:auto;transform:translateX(100%);box-shadow:-10px 0 34px rgba(0,0,0,.28);touch-action:pan-y}
.push .wrap{padding-bottom:calc(var(--safe-b) + 40px)}
.back{display:flex;align-items:center;gap:2px;height:38px;padding:0 12px 0 6px;border-radius:19px;background:var(--fill);font-size:15.5px;font-weight:600;flex:none}
.back svg{width:19px;height:19px}

/* ---------- menu ☰ (comme Zerly) ---------- */
#drawer{position:fixed;inset:0;z-index:39;pointer-events:none}
#drawer.open{pointer-events:auto}
.dr-scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .6s cubic-bezier(.45,0,.25,1)}
#drawer.open .dr-scrim{opacity:1}
#menu{position:absolute;top:0;bottom:0;left:0;width:min(84vw,340px);background:var(--bg);display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .66s cubic-bezier(.65,0,.25,1);box-shadow:10px 0 40px rgba(0,0,0,.25);padding-top:var(--safe-t);touch-action:pan-y}
#drawer.open #menu{transform:none}
.dr-head{display:flex;align-items:center;gap:11px;padding:18px 18px 12px}
.dr-head svg{width:30px;height:30px}
.dr-head b{font-size:22px;font-weight:800;letter-spacing:-.4px;flex:1}
.dr-sc{flex:1;overflow-y:auto;padding:0 10px 12px}
.dr-g{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin:18px 12px 6px}
.dr-it{display:flex;align-items:center;gap:13px;width:100%;padding:11px 12px;border-radius:14px;font-size:16.5px;font-weight:550;text-align:left;transition:background-color .15s}
.dr-it:active,.dr-it.on{background:var(--fill)}
.dr-it svg{width:21px;height:21px;color:var(--text2)}
.dr-foot{padding:12px 22px calc(var(--safe-b) + 16px);font-size:12.5px;color:var(--text3)}

/* ---------- feuilles du bas ---------- */
#sheets{position:fixed;inset:0;z-index:50;pointer-events:none}
.sw{position:absolute;inset:0;pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .4s}
.sw.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;max-height:calc(100% - var(--safe-t) - 28px);display:flex;flex-direction:column;background:var(--bg);border-radius:30px 30px 0 0;transform:translateY(100%);transition:transform .5s var(--sheet-ease);box-shadow:0 -10px 40px rgba(0,0,0,.15);padding-bottom:var(--safe-b)}
.sw.open .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--fill2);margin:8px auto 4px;flex:none}
.sb{overflow-y:auto;padding:8px 16px 18px}
.sb h2{font-size:22px;font-weight:750;letter-spacing:-.02em;margin:6px 4px 4px}
.sb .sub{font-size:14px;color:var(--text3);margin:0 4px 14px}
.kv{display:flex;justify-content:space-between;padding:11px 16px;font-size:15.5px}
.kv+.kv{border-top:.5px solid var(--sep)}
.kv span{color:var(--text2)}.kv b{font-weight:600}
.note{padding:12px 16px;font-size:15px;line-height:1.45;color:var(--text2);white-space:pre-wrap}

#toast{position:fixed;z-index:80;left:50%;top:calc(var(--safe-t) + 10px);transform:translate(-50%,-140%);background:var(--ink);color:var(--on-ink);padding:11px 18px;border-radius:20px;font-size:14.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:transform .45s var(--ease);white-space:nowrap}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

};
const ic=(n,sw=1.9)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${IC[n]||""}</svg>`;
const LOGO='<svg viewBox="0 0 64 64" fill="currentColor"><line x1="14" y1="16" x2="14" y2="52" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".5"/><line x1="32" y1="10" x2="32" y2="46" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".5"/><line x1="50" y1="4" x2="50" y2="36" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".5"/><rect x="8" y="26" width="12" height="20" rx="3"/><rect x="26" y="18" width="12" height="22" rx="3"/><rect x="44" y="9" width="12" height="22" rx="3"/></svg>';

/* ================= données (seulement sur ce téléphone) ================= */
function fix(s){
  s=s&&typeof s==="object"?s:{};
  s.trades=Array.isArray(s.trades)?s.trades:[];
  s.settings=Object.assign({theme:"auto",pair:"EUR/USD",pairs:["EUR/USD"],setups:["Cassure","Pullback","Range","Tendance"]},s.settings||{});
  if(!Array.isArray(s.settings.pairs)||!s.settings.pairs.length)s.settings.pairs=["EUR/USD"];
  if(!s.settings.pairs.includes(s.settings.pair))s.settings.pairs.unshift(s.settings.pair);
  // un journal par compte (perso, prop firm…) ; l'ancien capital devient celui du premier compte
  if(!Array.isArray(s.accounts)||!s.accounts.length)s.accounts=[{id:"a1",name:"Compte perso",type:"perso",cap:s.settings.cap!=null?s.settings.cap:10000,cur:s.settings.cur||"€"}];
  if(!s.accounts.some(a=>a.id===s.acc))s.acc=s.accounts[0].id;
  s.trades.forEach(t=>{if(!t.a||!s.accounts.some(a=>a.id===t.a))t.a=s.accounts[0].id});
  s.profile=Object.assign({first:"",last:"",photo:""},s.profile||{});
  // v0.3 : « Compte perso » devient « Compte réel » ; règles des prop firms
  s.accounts.forEach(a=>{if(a.type!=="prop")a.type="real";if(a.type==="prop"){a.ch=a.ch||"two";if(a.phase==null)a.phase=a.ch==="instant"?3:1;["dd","mdd","t1","t2"].forEach(k=>{if(a[k]==null)a[k]=PRESETS[a.ch][k]})}});
  if(s.settings.setups.join()==="Cassure,Pullback,Range,Tendance")s.settings.setups=["FVG","IFVG","Retour FVG","ODB","Retour ODB","Liquidity Sweep","OTE"];
  return s;
}
const PRESETS={two:{dd:5,mdd:10,t1:10,t2:5},one:{dd:3,mdd:10,t1:10,t2:null},instant:{dd:3,mdd:6,t1:null,t2:null}};
function load(){try{return fix(JSON.parse(localStorage.getItem(KEY)))}catch(_){return fix({})}}
const S=load();
function save(){FXC=null;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){toast("Impossible d'enregistrer")}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(v==null||v==="")return null;const n=parseFloat(String(v).replace(/\s/g,"").replace(",","."));return isFinite(n)?n:null};

/* ================= calculs ================= */
const ACC=()=>S.accounts.find(a=>a.id===S.acc)||S.accounts[0];
const TR=()=>S.trades.filter(t=>t.a===S.acc);
const isProp=a=>a.type==="prop";
const accType=a=>isProp(a)?"Prop firm":"Compte réel";
const CH={instant:"Instantané",one:"1 step",two:"2 steps"};
const phaseName=a=>a.phase>=3?"Compte financé":"Étape "+a.phase;
const accSub=a=>isProp(a)?[a.firm,CH[a.ch],phaseName(a)].filter(Boolean).join(" · "):"Compte réel";
const CUR=()=>ACC().cur||"€";
function money(v,sign,cur){const s=Math.abs(v).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});return (v<-0.004?"−":sign&&v>0.004?"+":"")+s+" "+(cur||CUR())}
const money0=(v,cur)=>Math.round(v).toLocaleString("fr-FR")+" "+(cur||CUR());
function moneyBig(v,sign){const s=money(v,sign),i=s.lastIndexOf(",");return esc(s.slice(0,i))+'<span class="cts">'+esc(s.slice(i))+"</span>"}
const pct=(v,d=1)=>(v*100).toLocaleString("fr-FR",{maximumFractionDigits:d})+" %";
const cls=v=>v>0.004?"pos":v<-0.004?"neg":"";
const fx=(v,d=1)=>(v>0?"+":v<0?"−":"")+Math.abs(v).toLocaleString("fr-FR",{maximumFractionDigits:d});
const nf=(v,d=1)=>v.toLocaleString("fr-FR",{maximumFractionDigits:d});
const IDX=/NAS|US30|US100|US500|SPX|GER|DAX|DJ|BTC|ETH/i;
const pipSize=p=>/XAU|GOLD/i.test(p)?0.1:/XAG|JPY/i.test(p)?0.01:IDX.test(p)?1:0.0001;
// taille d'un lot : forex 100 000, or 100 onces, argent 5 000, indices et crypto 1
const contract=p=>/XAU|GOLD/i.test(p)?100:/XAG/i.test(p)?5000:IDX.test(p)?1:100000;
const isOpen=t=>t.st==="open";
const sgn=t=>t.s==="sell"?-1:1;
function pips(t){if(t.e==null||t.x==null)return null;return (t.x-t.e)/pipSize(t.p)*sgn(t)}
function riskPips(t){return t.e!=null&&t.sl!=null&&t.sl!==t.e?Math.abs(t.e-t.sl)/pipSize(t.p):null}
function tpPips(t){return t.e!=null&&t.tp!=null?Math.abs(t.tp-t.e)/pipSize(t.p):null}
function rrPlan(t){const r=riskPips(t),g=tpPips(t);return r&&g!=null?g/r:null}
function rGot(t){const r=riskPips(t),p=pips(t);return r&&p!=null?p/r:null}
// cours EUR/USD pour convertir les dollars en euros : celui de ton dernier trade EUR/USD, sinon 1,08
let FXC=null;
function eurusd(){if(FXC)return FXC;let best=null;for(const t of S.trades)if(/^EUR\/?USD$/i.test(t.p)&&(t.x||t.e)&&(!best||(t.d+(t.h||""))>(best.d+(best.h||""))))best=t;return FXC=best?(best.x||best.e):1.08}
// valeur d'un pip pour 1 lot, dans la monnaie du compte
function pipValue(t,price){
  const P=(t.p||"").toUpperCase().replace(/\s/g,""),parts=P.split("/"),b=parts[0],q=parts[1]||"";price=price||t.x||t.e;
  let v=pipSize(P)*contract(P),usd=v;

// prop firm : depuis le début de l'étape en cours ; compte réel : objectif du mois et limites
function rules(a){
  const all=S.trades.filter(t=>t.a===a.id&&!isOpen(t)),td=today(),cap=+a.cap||0,sum=x=>x.reduce((s,t)=>s+t.r,0);
  const dayPnl=sum(all.filter(t=>(t.cd||t.d)===td));
  if(isProp(a)){
    const since=a.phaseStart||"0000",list=all.filter(t=>(t.cd||t.d)>=since),pnl=sum(list);
    const tp=a.phase===1?a.t1:a.phase===2?a.t2:null;
    return {prop:true,pnl,dayPnl,target:tp?cap*tp/100:null,dayMax:a.dd?cap*a.dd/100:null,totMax:a.mdd?cap*a.mdd/100:null,n:list.length};
  }
  const m=ym(td),pnlM=sum(all.filter(t=>ym(t.cd||t.d)===m)),pnl=sum(all);
  return {prop:false,pnl,pnlM,dayPnl,target:+a.goal||null,dayMax:+a.maxDay||null,totMax:+a.maxTot||null};
}
function meter(label,val,max,kind,cur){
  const q=max?Math.max(0,Math.min(1,val/max)):0,over=val>=max-0.004;
  const st=kind==="goal"?(over?"ok":""):(over?"bad":q>.7?"warn":"");
  const left=kind==="goal"?(over?"Objectif atteint":"Encore "+money0(max-val,cur)):(over?"Limite atteinte":"Il te reste "+money0(max-val,cur));
  return `<div class="mt ${st}"><div class="mt-h"><span>${label}</span><b class="num">${kind==="goal"?(val<0?"−":"")+money0(Math.abs(val),cur):money0(Math.max(0,val),cur)} <span class="mut">/ ${money0(max,cur)}</span></b></div><div class="mt-b"><i class="${kind==="goal"?"g":""}" style="width:${(q*100).toFixed(1)}%"></i></div><small>${left}</small></div>`;
}
function rulesCard(a){
  const R=rules(a),cur=a.cur||"€";
  if(!R.target&&!R.dayMax&&!R.totMax)return "";
  const brk=(R.dayMax&&-R.dayPnl>=R.dayMax-0.004)||(R.totMax&&-R.pnl>=R.totMax-0.004),won=R.target&&(R.prop?R.pnl:R.pnlM)>=R.target-0.004;
  const head=R.prop?`<b>${esc(a.firm||"Prop firm")} · ${CH[a.ch]}</b><span class="phase">${phaseName(a)}</span>`:`<b>Mes limites</b><span class="phase">${MOIS[new Date().getMonth()].replace(/^./,c=>c.toUpperCase())}</span>`;
  return `<div class="card pad rules">
    <div class="rh">${head}</div>
    ${brk?`<div class="alert bad">${ic("info",2)}<span>Une limite de perte est atteinte. ${R.prop?"Vérifie ton compte chez la prop firm.":"Stop pour aujourd'hui."}</span></div>`:""}

    ${R.target?meter(R.prop?"Objectif de l'étape":"Objectif du mois",R.prop?R.pnl:R.pnlM,R.target,"goal",cur):""}

function choosePhoto(cb){

// recadrage : glisser, pincer à deux doigts, molette ou curseur ; la photo est gardée en 400×400
function cropPhoto(img){return new Promise(res=>{let done=null;const V=Math.min(260,innerWidth-90),nw=img.naturalWidth,nh=img.naturalHeight,base=Math.max(V/nw,V/nh);let z=1,x=0,y=0;
  const w=sheet(`<h2>Recadrer la photo</h2><div class="sub">Fais glisser la photo et zoome pour choisir ce qui apparaît dans le rond.</div>
    <div class="crop-v noswipe" style="width:${V}px;height:${V}px"><img src="${img.src}" alt="" draggable="false"></div>
    <label class="crop-z noswipe">${ic("search")}<input type="range" min="1" max="4" step="0.01" value="1" aria-label="Zoom"></label>
    <button class="btn" data-ok>Utiliser cette photo</button>`);
  const v=w.querySelector(".crop-v"),im=v.querySelector("img"),zr=w.querySelector("input[type=range]");
  const draw=()=>{const k=base*z,iw=nw*k,ih=nh*k,mx=(iw-V)/2,my=(ih-V)/2;x=Math.max(-mx,Math.min(mx,x));y=Math.max(-my,Math.min(my,y));
    im.style.width=iw+"px";im.style.height=ih+"px";im.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;zr.value=z};
  const zoomTo=(nz,cx=0,cy=0)=>{nz=Math.max(1,Math.min(4,nz));const q=nz/z;x=cx-(cx-x)*q;y=cy-(cy-y)*q;z=nz;draw()};
  const P=new Map();let last=null;
  v.addEventListener("pointerdown",e=>{try{v.setPointerCapture(e.pointerId)}catch(_){}P.set(e.pointerId,{x:e.clientX,y:e.clientY});last=null});
  v.addEventListener("pointermove",e=>{if(!P.has(e.pointerId))return;const p0=P.get(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(P.size===1){x+=e.clientX-p0.x;y+=e.clientY-p0.y;draw()}
    else{const [a,b]=[...P.values()],dd=Math.hypot(a.x-b.x,a.y-b.y);if(last){const rc=v.getBoundingClientRect();zoomTo(z*dd/last,(a.x+b.x)/2-rc.left-V/2,(a.y+b.y)/2-rc.top-V/2)}last=dd}});
  const up=e=>{P.delete(e.pointerId);last=null};v.addEventListener("pointerup",up);v.addEventListener("pointercancel",up);
  v.addEventListener("wheel",e=>{e.preventDefault();const rc=v.getBoundingClientRect();zoomTo(z*(e.deltaY<0?1.08:1/1.08),e.clientX-rc.left-V/2,e.clientY-rc.top-V/2)},{passive:false});
  zr.oninput=()=>zoomTo(+zr.value);draw();
  w._onClose=()=>setTimeout(()=>res(done),320);
  w.querySelector("[data-ok]").onclick=()=>{const k=base*z,sw=V/k,sx=nw/2-x/k-sw/2,sy=nh/2-y/k-sw/2,S2=400,c=document.createElement("canvas");c.width=c.height=S2;
    c.getContext("2d").drawImage(img,sx,sy,sw,sw,0,0,S2,S2);done=c.toDataURL("image/jpeg",.88);w._close()};
})}

function renderTradeList(){

  const by={};list.forEach(t=>(by[t.d]=by[t.d]||[]).push(t));

function stepBubble(now){const dt=Math.min(.032,(now-(bubble.last||now))/1000)||.016;bubble.last=now;const k=230,c=15.5;
  for(let i=0;i<4;i++){const h=dt/4;const a=k*(bubble.target-bubble.x)-c*bubble.v;bubble.v+=a*h;bubble.x+=bubble.v*h}
  renderBubble();if(Math.abs(bubble.v)<2&&Math.abs(bubble.target-bubble.x)<.25){bubble.x=bubble.target;bubble.v=0;renderBubble();bubble.raf=0;bubble.last=0;return}bubble.raf=requestAnimationFrame(stepBubble)}
const kick=()=>{if(!bubble.raf){bubble.last=0;bubble.raf=requestAnimationFrame(stepBubble)}};
function bubbleTo(i){bubble.target=itemX(i);if(reduced){bubble.x=bubble.target;renderBubble()}else kick()}
(()=>{let d=null;
  tabbar.addEventListener("pointerdown",e=>{d={x:e.clientX,id:e.pointerId,drag:false,ox:tabbar.getBoundingClientRect().left};try{tabbar.setPointerCapture(e.pointerId)}catch(_){}});
  tabbar.addEventListener("pointermove",e=>{if(!d||e.pointerId!==d.id)return;if(!d.drag&&Math.abs(e.clientX-d.x)>6)d.drag=true;if(d.drag){bubble.target=Math.max(itemX(0)-14,Math.min(itemX(N-1)+14,e.clientX-d.ox-ITEM/2));kick()}});
  const up=e=>{if(!d||e.pointerId!==d.id)return;const st=d;d=null;if(e.type==="pointercancel"&&!st.drag){bubbleTo(cur);return}const i=Math.max(0,Math.min(N-1,Math.floor((e.clientX-st.ox-PAD)/ITEM)));go(i)};
  tabbar.addEventListener("pointerup",up);tabbar.addEventListener("pointercancel",up);
  tabbar.addEventListener("click",e=>{const t=e.target.closest(".tab");if(t&&e.detail===0)go(+t.dataset.i)});
})();
bubbleTo(0);bubble.x=bubble.target;renderBubble();
addEventListener("resize",()=>{layoutTabs();bubble.x=bubble.target=itemX(cur);bubble.v=0;renderBubble()});
document.addEventListener("focusin",e=>{if(e.target.matches("input:not([type=file]),textarea"))tabbar.classList.add("away")});
document.addEventListener("focusout",()=>setTimeout(()=>{const a=document.activeElement;if(!a||!a.matches||!a.matches("input,textarea"))tabbar.classList.remove("away")},60));
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;const w=topSheet();if(w)return w._close();if(PUSH.length)return closePush(true)});

/* ================= exemples (pour voir le rendu) ================= */
function demoTrades(){
  const out=[],base=new Date();const setups=S.settings.setups,emo=["Calme","Confiant","Patient","Stress","Fatigue","FOMO"];
  let seed=7+S.accounts.indexOf(ACC())*13;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  for(let k=0;k<140;k++){
    const d=new Date(base-Math.floor(k*1.9)*864e5);if(d.getDay()===0||d.getDay()===6)continue;
    const gold=rnd()<.2,p=gold?"XAU/USD":"EUR/USD",ps=pipSize(p),s=rnd()>.5?"buy":"sell",dir=s==="buy"?1:-1;
    const e=gold?+(2600+rnd()*80).toFixed(2):+(1.07+rnd()*.03).toFixed(5),risk=gold?30+Math.round(rnd()*40):8+Math.round(rnd()*14);
    const u=rnd(),ex=u<.38?"TP":u<.78?"SL":u<.88?"BE":"Manuel",rr=ex==="TP"?2:ex==="SL"?-1:ex==="BE"?0:(rnd()*2.4-.6);
    const pp=+(risk*rr).toFixed(1),x=+(e+pp*ps*dir).toFixed(gold?2:5),l=gold?[.02,.05,.1][Math.floor(rnd()*3)]:[.1,.2,.3,.5][Math.floor(rnd()*4)];
    const hh=7+Math.floor(rnd()*11),mm=Math.floor(rnd()*60),lenM=10+Math.floor(rnd()*(ex==="SL"?60:180)),end=new Date(d.getFullYear(),d.getMonth(),d.getDate(),hh,mm+lenM);
    const t={id:uid(),demo:true,a:S.acc,p,s,st:"closed",d:iso(d),h:String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0"),cd:iso(end),ch:String(end.getHours()).padStart(2,"0")+":"+String(end.getMinutes()).padStart(2,"0"),
      e,sl:+(e-risk*ps*dir).toFixed(gold?2:5),tp:+(e+risk*2*ps*dir).toFixed(gold?2:5),x,l,ex,fee:+(l*7).toFixed(2),set:setups[Math.floor(rnd()*setups.length)]||"",emo:emo[Math.floor(rnd()*emo.length)],plan:rnd()>.25,n:""};
    t.r=estimate(t);out.push(t);
  }
  out.push({id:uid(),demo:true,a:S.acc,p:"EUR/USD",s:"buy",st:"open",d:today(),h:"09:12",cd:"",ch:"",e:1.0862,sl:1.0848,tp:1.089,x:null,l:.2,r:null,set:setups[0]||"",emo:"Calme",plan:true,n:"Prise de liquidité sous le bas asiatique, entrée sur le FVG."});
  return out;
}

/* ================= écran d'ouverture : les bougies ================= */
// 3 haussières, une 4e qui monte puis se fait rejeter (grande mèche) et clôture en grosse baissière,
// une petite baissière, puis 5 haussières ; ensuite « Journal » apparaît
(()=>{
  const sp=$("splash"),sv=$("spSvg");let gone=false;
  const finish=()=>{if(gone)return;gone=true;sp.classList.add("gone");setTimeout(()=>sp.remove(),700)};
  if(reduced){finish();return}
  const K=[[50,58],[58,66],[66,74],[74,93,54],[54,48],[48,56],[56,63],[63,71],[71,80],[80,90]];
  const T=[150,150,150,560,190,115,115,115,115,140],KT=[null,null,null,[0,.36,1],null];
  const W=14,G=6,LO=40,HI=97,H=120,Y=v=>(H-(v-LO)/(HI-LO)*H).toFixed(2);
  sv.setAttribute("viewBox",`0 0 ${K.length*(W+G)-G} ${H}`);
  const NS="http://www.w3.org/2000/svg",els=K.map((k,i)=>{const g=document.createElementNS(NS,"g"),l=document.createElementNS(NS,"line"),r=document.createElementNS(NS,"rect");
    const x=i*(W+G);l.setAttribute("x1",x+W/2);l.setAttribute("x2",x+W/2);r.setAttribute("x",x);r.setAttribute("width",W);r.setAttribute("rx",2.5);g.append(l,r);g.style.opacity=0;sv.appendChild(g);return {g,l,r}});
  const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
  function draw(i,q){const k=K[i],kt=KT[i]||k.map((_,j)=>j/(k.length-1)),e=els[i];
    let j=0;while(j<k.length-2&&q>kt[j+1])j++;const u=Math.min(1,Math.max(0,(q-kt[j])/(kt[j+1]-kt[j]))),p=k[j]+(k[j+1]-k[j])*ease(u);
    const seen=k.slice(0,j+1).concat(p),hi=Math.max(...seen),lo=Math.min(...seen),o=k[0],up=p>=o;
    e.g.style.opacity=1;e.g.setAttribute("class",up?"cu":"cd");
    e.l.setAttribute("y1",Y(hi+(q>=1&&i!==3?1.2:0)));e.l.setAttribute("y2",Y(lo-(q>=1?1:0)));
    const top=Math.max(o,p),bot=Math.min(o,p);e.r.setAttribute("y",Y(top));e.r.setAttribute("height",Math.max(1.2,(top-bot)/(HI-LO)*H).toFixed(2))}
  const total=T.reduce((a,b)=>a+b,0);let t0=null;
  const step=now=>{if(gone)return;if(t0==null)t0=now;let el=now-t0,i=0;
    while(i<K.length&&el>T[i]){draw(i,1);el-=T[i];i++}
    if(i<K.length){draw(i,el/T[i]);requestAnimationFrame(step)}
    else{sp.classList.add("txt");setTimeout(finish,620)}};
  requestAnimationFrame(step);
  setTimeout(finish,total+2200); // au cas où l'animation serait bloquée
})();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
